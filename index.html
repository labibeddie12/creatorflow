  var targets = '.service-card, .cf-rental-card, .section-head, .cf-rentals-head, .cf-tieups-head, .cf-members-head';
  var seen = new WeakSet();
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('cf-visible');
        io.unobserve(entry.target);
      }

  function scan(){

<script>
(function(){
  var PAGE_SIZE = 10, currentPage = 1, pagerEl = null, observer = null;

  function paginate(){
    var grid = document.querySelector('.service-grid');
    if(!grid) return;
    var cards = Array.prototype.slice.call(grid.querySelectorAll('.service-card'));
    if(cards.length === 0) return;
    var totalPages = Math.ceil(cards.length / PAGE_SIZE);
    if(currentPage > totalPages) currentPage = totalPages;
    if(currentPage < 1) currentPage = 1;

    if(observer) observer.disconnect();

    if(cards.length <= PAGE_SIZE){
      cards.forEach(function(c){ c.style.display = ''; });
      if(pagerEl){ pagerEl.remove(); pagerEl = null; }
    } else {
      cards.forEach(function(c, i){
        c.style.display = (Math.floor(i / PAGE_SIZE) + 1 === currentPage) ? '' : 'none';
      });
      if(!pagerEl){
        pagerEl = document.createElement('div');
        pagerEl.className = 'cf-service-pager';
        grid.insertAdjacentElement('afterend', pagerEl);
      }
      pagerEl.innerHTML = '<button class="cf-pager-btn" data-dir="prev"'+(currentPage===1?' disabled':'')+'>← Previous</button><span class="cf-pager-info">Page '+currentPage+' of '+totalPages+'</span><button class="cf-pager-btn" data-dir="next"'+(currentPage===totalPages?' disabled':'')+'>Next →</button>';
      pagerEl.querySelector('[data-dir="prev"]').onclick = function(){ currentPage--; paginate(); grid.scrollIntoView({behavior:'smooth',block:'start'}); };
      pagerEl.querySelector('[data-dir="next"]').onclick = function(){ currentPage++; paginate(); grid.scrollIntoView({behavior:'smooth',block:'start'}); };
    }

    if(observer) observer.observe(document.body, {childList:true, subtree:true});
  }

  document.body.addEventListener('click', function(e){
    if(e.target.closest && e.target.closest('.filters button')) currentPage = 1;
  });

  observer = new MutationObserver(paginate);
  observer.observe(document.body, {childList:true, subtree:true});
  paginate();
})();
</script>

  const existingDocs=existingSnap.docs.slice().sort((a,b)=>(b.data().lastMessageAt?.seconds||b.data().createdAt?.seconds||0)-(a.data().lastMessageAt?.seconds||a.data().createdAt?.seconds||0));

  if(existingDoc){
    chatId=existingDoc.id;
    await updateDoc(doc(chDb,"liveSupportChats",chatId),{visitorName:name,visitorEmail:email,status:"pending_human",updatedAt:serverTimestamp()});
  }else{
    const ref=await addDoc(collection(chDb,"liveSupportChats"),{visitorUid,visitorName:name,visitorEmail:email,status:"pending_human",assignedTo:"",createdAt:serverTimestamp(),lastMessageAt:serverTimestamp()});

      const sorted=s.docs.slice().sort((a,b)=>(a.data().createdAt?.seconds||0)-(b.data().createdAt?.seconds||0));
      sorted.forEach(d=>{
        if(renderedIds.has(d.id))return;
        renderedIds.add(d.id);
        if(wasClosed)return; // pre-closure history stays out of the visitor's view, but stays marked seen
        const m=d.data();

      });
      return;
    }
    s.docChanges().forEach(change=>{
      if(change.type==="added"&&!renderedIds.has(change.doc.id)){

        chAppendRow("staff",m.text);

      unsubMsgs?.();unsubChatDoc?.();

  if(!chBody().children.length){
    chAppendRow("bot","Hi! I'm the CreatorFlow assistant. Pick a question below, or chat with our team.","Assistant");
    chAppendQuick();
  }
};
document.getElementById("cf-chat-close").onclick=()=>{document.getElementById("cf-chat-panel").hidden=true};

document.getElementById("cf-chat-body").addEventListener("click",e=>{
  const fi=e.target.dataset.faq;
  if(fi!==undefined){
    const item=FAQ[Number(fi)];
    e.target.closest(".cf-chat-quick")?.remove();
    chAppendRow("visitor",item.q);
    const stopTyping=chTypingIndicator();
    setTimeout(()=>{stopTyping();chAppendRow("bot",item.a,"Assistant");chAppendQuick()},500);
    return;
  }
  if(e.target.hasAttribute("data-talk-human")){
    e.target.closest(".cf-chat-quick")?.remove();
    chAppendRow("visitor","I'd like to talk to your team");
    const stopTyping=chTypingIndicator();
    setTimeout(()=>{stopTyping();chAppendRow("bot","Sure! Just share your name and email so our team can follow up.","Assistant");showIntroForm()},500);
  }
});

document.getElementById("cf-chat-input-area").addEventListener("click",async e=>{
  if(e.target.id==="cf-chat-start"){
    const name=document.getElementById("cf-chat-name").value.trim(),email=document.getElementById("cf-chat-email").value.trim();
    if(!name||!email)return;
    e.target.disabled=true;e.target.textContent="Starting…";
    try{
      await startLiveChat(name,email);
      chAppendRow("bot","Thanks "+name+"! Type your message below — our team will reply here.","Assistant");
    }catch(err){chAppendRow("bot","Something went wrong starting the chat. Please try again.","Assistant");e.target.disabled=false;e.target.textContent="Start chat"}
  }
  if(e.target.id==="cf-chat-end-btn"){
    if(!chatId)return;
    e.target.disabled=true;
    try{
      unsubMsgs?.();unsubChatDoc?.();
      await updateDoc(doc(chDb,"liveSupportChats",chatId),{status:"closed",updatedAt:serverTimestamp()});
      chAppendRow("bot","This conversation has been closed. Feel free to start a new one anytime!","Assistant");
      document.getElementById("cf-chat-input-area").innerHTML="";
      chatId=null;
    }catch(err){e.target.disabled=false;}
  }
});

document.getElementById("cf-chat-input-area").addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id!=="cf-chat-send-form")return;
  const input=document.getElementById("cf-chat-text"),btn=document.getElementById("cf-chat-send-btn"),text=input.value.trim();
  if(!text||!chatId)return;
  input.value="";btn.disabled=true;
  chAppendRow("visitor",text);
  try{
    const ref=await addDoc(collection(chDb,"liveSupportMessages"),{chatId,sender:"visitor",text,createdAt:serverTimestamp()});
    renderedIds.add(ref.id);
    await updateDoc(doc(chDb,"liveSupportChats",chatId),{lastMessageAt:serverTimestamp(),lastMessagePreview:text,status:"pending_human"});
  }catch(err){chAppendRow("bot","Message failed to send — please try again.","Assistant")}
  btn.disabled=false;input.focus();
});
</script>
</body></html>
